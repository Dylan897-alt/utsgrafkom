<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Spike 3D - WebGL</title>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #123;
      font-family: system-ui, sans-serif;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }

    /* Petunjuk kontrol di pojok kiri atas */
    #h {
      position: fixed;
      left: 12px;
      top: 10px;
      color: #fff;
      font-size: 13px;
      line-height: 1.5;
      text-shadow: 0 1px 3px #000;
      pointer-events: none;
    }

    /* Panel tombol bawah (aksi karakter & tombol siram air) */
    #ui,
    #growUi {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 16px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 0 10px;
    }

    #ui button,
    #growUi button {
      background: rgba(20, 20, 30, 0.65);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: 0.15s;
    }

    #ui button:hover,
    #growUi button:hover {
      background: rgba(60, 60, 90, 0.8);
    }

    #ui button.active {
      background: #e0a020;
      border-color: #fff;
    }

    #growUi button {
      background: rgba(20, 90, 40, 0.75);
    }

    /* Teks tujuan (objective) di tengah atas */
    #obj {
      position: fixed;
      left: 0;
      right: 0;
      top: 12px;
      text-align: center;
      color: #fff;
      font: 600 15px/1.4 system-ui, sans-serif;
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
    }

    /* Layar putih untuk efek Ulti */
    #flash {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <canvas id="mycanvas"></canvas>

  <div id="h">
    <b>Spike 3D</b> (WebGL murni)<br />
    Seret = putar kamera &middot; Scroll = zoom &middot; Spasi = jeda<br />
    WASD = jalan (setelah tumbuh)
  </div>
  <div id="obj"></div>
  <div id="flash"></div>

  <div id="growUi">
    <button id="growBtn">💧 Siram Air &amp; Tumbuh</button>
  </div>

  <div id="ui" style="display: none">
    <button data-s="idle" class="active">Diam</button>
    <button data-s="wave">Wave</button>
    <button data-s="skill">Skill (Stick Around)</button>
    <button data-s="ulti" id="ultiBtn" disabled title="Buka Power Box untuk membuka Ulti">
      Ulti (Super) 🔒
    </button>
  </div>

  <script src="libs.js"></script>
  <!-- <script src="sprout.js"></script> -->
  <script src="script.js"></script>
</body>

</html>
